<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="dark">

  <div class="navbar">
    <h2>Admin Panel</h2>
	<<a href="register.html" class="admin-btn">Add Admin</a>
    <button onclick="logout()">Logout</button>
  </div>

  <div class="admin-panel">

    <h3>Add New Game</h3>

    <input type="text" id="gameTitle" placeholder="Game Title">
    <input type="text" id="gameCategory" placeholder="Category (NES/SEGA/PS1)">
    <input type="number" id="gameYear" placeholder="Release Year">

    <label>Cover Image:</label>
    <input type="file" id="coverFile">

    <label>Game File (ZIP):</label>
    <input type="file" id="gameFile">

    <label>Description:</label>
    <textarea id="gameDescription" placeholder="Short description"></textarea>

    <button onclick="addGame()">Upload Game</button>

    <hr>

    <h3>Game List</h3>
    <div id="adminGameList"></div>

  </div>

  <!-- EDIT MODAL -->
  <div id="editModal" class="edit-modal">
    <div class="edit-content">
      <h3>Edit Game</h3>

      <input type="text" id="editTitle" placeholder="Game Title">
      <input type="text" id="editCategory" placeholder="Category">
      <input type="number" id="editYear" placeholder="Year">

      <label>Change Cover (optional)</label>
      <input type="file" id="editCover">

      <label>Change Game File (optional)</label>
      <input type="file" id="editFile">

      <label>Description:</label>
      <textarea id="editDescription" placeholder="Description"></textarea>

      <button onclick="saveEdit()">Save Changes</button>
      <button class="close-btn" onclick="closeEdit()">Cancel</button>
    </div>
  </div>
  <!-- END EDIT MODAL -->

<footer class="footer">
  <p>© 2025 Retro Games Hub — All Rights Reserved</p>
</footer>

  <script src="script.js"></script>
</body>
</html>
