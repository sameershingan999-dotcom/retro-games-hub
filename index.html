<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Retro Games Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="dark">
  <!-- NAVBAR -->
  <header class="navbar">
    <h2>Retro Games Hub</h2>

    <!-- Desktop links -->
    <nav class="nav-links">
      <a href="login.html" class="admin-btn">Admin Login</a>
    </nav>

    <!-- Hamburger for mobile -->
    <div class="hamburger" id="hamburgerBtn">☰</div>
  </header>

  <!-- Mobile slide-down menu -->
  <div class="mobile-menu" id="mobileMenu" style="display:none;">
    <a href="index.html">Home</a>
    <a href="login.html">Admin Login</a>
    <a href="admin.html">Dashboard</a>
    <a href="admins.html">Admins</a>
    <button onclick="logout()">Logout</button>
  </div>

  <!-- HERO -->
  <section class="hero">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1>Retro Games Hub</h1>
      <p>Play classic retro games from NES, SEGA, PS1 and Arcade</p>
      <a href="#featured"><button class="hero-btn">Explore Games</button></a>
    </div>
  </section>

  <!-- CATEGORY IMAGE ROW -->
  <div class="category-image-row">
    <div class="category-box" onclick="selectCategory('NES')">
      <img src="https://i.ibb.co/3hkRdqL/nes.png" alt="NES" />
      <p>NES</p>
    </div>

    <div class="category-box" onclick="selectCategory('SEGA')">
      <img src="https://i.ibb.co/QCc6P0C/sega.png" alt="SEGA" />
      <p>SEGA</p>
    </div>

    <div class="category-box" onclick="selectCategory('PS1')">
      <img src="https://i.ibb.co/8cRT5j1/ps1.png" alt="PS1" />
      <p>PS1</p>
    </div>

    <div class="category-box" onclick="selectCategory('Arcade')">
      <img src="https://i.ibb.co/VHWv4nR/arcade.png" alt="Arcade" />
      <p>Arcade</p>
    </div>
  </div>

  <!-- FEATURED -->
  <section id="featured" class="featured-section">
    <h3>Featured Games</h3>
    <div id="featuredGames" class="featured-list"></div>
  </section>

  <!-- TRENDING -->
  <section id="trending" class="featured-section">
    <h3>🔥 Trending Games</h3>
    <div id="trendingGames" class="featured-list"></div>
  </section>

  <!-- SEARCH + SORT -->
  <div class="filters">
    <div class="search-container">
      <input
        type="text"
        id="search"
        placeholder="Search games..."
        onkeyup="handleSearchInput()"
        autocomplete="off"
      />
      <div id="searchSuggestions" class="suggestions-box"></div>
    </div>

    <select id="sortFilter" onchange="renderGames()">
      <option value="newest">Newest</option>
      <option value="oldest">Oldest</option>
      <option value="az">A–Z</option>
      <option value="za">Z–A</option>
    </select>

    <!-- Hidden category filter used by image buttons -->
    <select id="categoryFilter" style="display:none">
      <option value="all">All</option>
      <option value="NES">NES</option>
      <option value="SEGA">SEGA</option>
      <option value="PS1">PS1</option>
      <option value="Arcade">Arcade</option>
    </select>
  </div>

  <!-- GAME GRID -->
  <h3 class="section-title">All Games</h3>
  <div id="gameList" class="game-list"></div>

  <!-- FOOTER -->
  <footer class="footer">
    <p>© 2025 Retro Games Hub — All Rights Reserved</p>
  </footer>

  <!-- MAIN SCRIPT -->
  <script src="script.js"></script>

  <!-- FEATURED + TRENDING render -->
  <script>
    (function populateFeaturedTrending(){
      const storedGames = JSON.parse(localStorage.getItem("games")) || [];

      const featured = [...storedGames].sort((a, b) => b.year - a.year).slice(0, 3);
      document.getElementById("featuredGames").innerHTML = featured.length
        ? featured.map(g => `
            <div class="featured-card" onclick="openDetails(${g.id})">
              <img src="${g.cover}" alt="${g.title}">
              <h4>${g.title}</h4>
              <p>${categoryIcons[g.category] || "🎮"} ${g.category} (${g.year})</p>
            </div>
          `).join("")
        : "<p>No featured games yet.</p>";

      const trending = [...storedGames].sort((a,b)=> (b.downloads||0) - (a.downloads||0)).slice(0,3);
      document.getElementById("trendingGames").innerHTML = trending.length
        ? trending.map(g => `
            <div class="featured-card" onclick="openDetails(${g.id})">
              <img src="${g.cover}" alt="${g.title}">
              <h4>${g.title}</h4>
              <p>🔥 ${(g.downloads||0)} downloads</p>
              <p>${categoryIcons[g.category] || "🎮"} ${g.category}</p>
            </div>
          `).join("")
        : "<p>No trending games yet.</p>";
    })();
  </script>
</body>
</html>
