<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Retro Games Hub</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body class="dark">
  
  <!-- NAVBAR -->
  <div class="navbar">
    <h2>Retro Games Hub</h2>
    <a href="login.html" class="admin-btn">Admin Login</a>
  </div>

  <!-- HERO SECTION -->
  <section class="hero">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1>Retro Games Hub</h1>
      <p>Play classic games online for free!</p>
      <a href="#featured">
        <button class="hero-btn">Explore Games</button>
      </a>
    </div>
  </section>

  <!-- FEATURED GAMES -->
  <section id="featured" class="featured-section">
    <h3>Featured Games</h3>
    <div id="featuredGames" class="featured-list"></div>
  </section>

  <!-- FILTERS -->
  <div class="filters">
    <input type="text" id="search" placeholder="Search games..." onkeyup="renderGames()">

    <select id="categoryFilter" onchange="renderGames()">
      <option value="all">All Categories</option>
      <option value="NES">NES</option>
      <option value="SEGA">SEGA</option>
      <option value="PS1">PS1</option>
      <option value="Arcade">Arcade</option>
    </select>

    <select id="sortFilter" onchange="renderGames()">
      <option value="newest">Newest</option>
      <option value="oldest">Oldest</option>
      <option value="az">A–Z</option>
      <option value="za">Z–A</option>
    </select>

    <div class="alphabet">
      <button onclick="filterLetter('all')">All</button>
      <script>
        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
        document.write(
          letters.map(l => `<button onclick="filterLetter('${l}')">${l}</button>`).join('')
        );
      </script>
    </div>
  </div>

  <!-- ALL GAMES -->
  <div id="gameList" class="game-list"></div>

  <!-- FOOTER -->
  <footer class="footer">
    <p>© 2025 Retro Games Hub — All Rights Reserved</p>
  </footer>

  <script src="script.js"></script>

  <!-- FEATURED GAMES SCRIPT -->
  <script>
    const storedGames = JSON.parse(localStorage.getItem("games")) || [];
    const featured = storedGames
      .sort((a, b) => b.year - a.year)
      .slice(0, 3);

    document.getElementById("featuredGames").innerHTML = featured.length
      ? featured.map(g => `
        <div class="featured-card" onclick="openDetails(${g.id})">
          <img src="${g.cover}">
          <h4>${g.title}</h4>
          <p>${categoryIcons[g.category] || "🎮"} ${g.category} (${g.year})</p>
        </div>
      `).join("")
      : "<p>No games added yet.</p>";
  </script>

</body>
</html>
