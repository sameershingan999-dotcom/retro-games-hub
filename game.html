<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Game Details</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark">

<div class="navbar">
    <h2>Game Details</h2>
    <a href="index.html" class="admin-btn">Back to Home</a>
</div>

<div class="game-details" id="details"></div>

<script src="script.js"></script>

<script>
    const gameId = new URLSearchParams(location.search).get("id");
    const games = JSON.parse(localStorage.getItem("games")) || [];
    const game = games.find(g => String(g.id) === String(gameId));

    if (!game) {
        document.getElementById("details").innerHTML = "<p>Game not found.</p>";
    } else {
        document.getElementById("details").innerHTML = `
            <div class="game-details-card">
                <img src="${game.cover}">
                <h2>${game.title}</h2>

                <p><strong>Category:</strong> 
                    ${categoryIcons[game.category] || "🎮"} ${game.category}
                </p>

                <p><strong>Year:</strong> ${game.year}</p>

                <p><strong>Description:</strong></p>
                <p>${game.description || "No description added."}</p>

                <a href="${game.file}" download="${game.title}.zip">
                    <button>Download Game</button>
                </a>
            </div>
        `;
    }
</script>

</body>
</html>
