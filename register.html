<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register Admin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="dark">
  <div class="navbar">
    <h2>Register Admin</h2>
    <div>
      <a href="admin.html" class="admin-btn">Dashboard</a>
      <button onclick="logout()" class="admin-btn">Logout</button>
    </div>
  </div>

  <div class="form-box">
    <h3 style="text-align:center;margin-bottom:8px;">Create New Admin</h3>
    <input type="email" id="regEmail" placeholder="Admin Email">
    <input type="password" id="regPassword" placeholder="Password">
    <input type="password" id="regPasswordConfirm" placeholder="Confirm Password">
    <button onclick="registerAdmin()">Register Admin</button>
    <p id="registerMessage" class="msg"></p>
    <p style="margin-top:8px;color:#aaa;font-size:13px;text-align:center;">
      Password must be at least 8 characters and include uppercase, lowercase and a number.
    </p>
  </div>

  <script src="script.js"></script>
</body>
</html>
